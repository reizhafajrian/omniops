name: Release

on:
  push:
    tags:
      - 'v*' # Trigger workflow on tags like v1.0.0, v2.1.3

permissions:
  contents: write # Needed to create GitHub Releases

jobs:
  build-and-release:
    name: Build and Release for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: omni
            archive_name: omni-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-13 # Intel Mac
            target: x86_64-apple-darwin
            binary_name: omni
            archive_name: omni-x86_64-apple-darwin.tar.gz
          - os: macos-latest # Apple Silicon (M1/M2/M3)
            target: aarch64-apple-darwin
            binary_name: omni
            archive_name: omni-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: omni.exe
            archive_name: omni-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Backend (OmniOps)
        working-directory: ./backend
        run: cargo build --release --bin omni --target ${{ matrix.target }}

      - name: Archive Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cd backend/target/${{ matrix.target }}/release
          tar -czvf ../../../../${{ matrix.archive_name }} ${{ matrix.binary_name }}

      - name: Archive Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cd backend/target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.binary_name }} -DestinationPath ../../../../${{ matrix.archive_name }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
          draft: false
          generate_release_notes: true
