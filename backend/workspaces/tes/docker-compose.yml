version: "3.9"

services:
  # =====================
  # PRODUCTION SERVICES
  # =====================
  postgres-prod:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    volumes:
      - ./data/postgres-prod:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: root
      POSTGRES_DB: whatsapp_db
    ports:
      - "5432:5432"
    networks: [production-network]

  redis-prod:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server --requirepass s3cr3t
    volumes:
      - ./data/redis-prod:/data
    networks: [production-network]

  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - redis-prod
  #     - postgres-prod
  #   networks:
  #     - production-network
  #     - development-network

networks:
  development-network:
    driver: bridge
  production-network:
    driver: bridge
